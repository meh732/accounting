<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <!-- Decorative Ledger / Calculator Symbol -->
  <g transform="translate(96, 86)">
    <!-- Main Ledger Sheet -->
    <rect x="0" y="0" width="320" height="340" rx="36" fill="#ffffff" fill-opacity="0.95" />
    <!-- Header Bar -->
    <rect x="0" y="0" width="320" height="85" rx="36" fill="#6366f1" />
    <rect x="0" y="55" width="320" height="30" fill="#6366f1" />
    <!-- Mini Coins / Badge -->
    <circle cx="260" cy="42" r="18" fill="url(#goldGrad)" />
    <circle cx="215" cy="42" r="18" fill="#e0e7ff" />
    <!-- Chart Bars -->
    <rect x="40" y="240" width="40" height="60" rx="10" fill="#6366f1" />
    <rect x="100" y="190" width="40" height="110" rx="10" fill="#4f46e5" />
    <rect x="160" y="140" width="40" height="160" rx="10" fill="#4338ca" />
    <rect x="220" y="105" width="40" height="195" rx="10" fill="url(#goldGrad)" />
    <!-- Persian Letter / Logo Accent -->
    <path d="M50 45 C 50 30, 80 30, 80 45 C 80 60, 110 60, 110 45" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
